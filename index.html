<title>SECOND LIFE: карточка товара</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--text:#16161a;--muted:#6b6b72;--line:#d9d8d2;--btn:#0b0b0d;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101013;--card:#1a1a1f;--text:#f1f1f3;--muted:#9a9aa3;--line:#33333b;--btn:#fff;--btnt:#0b0b0d}}
:root[data-theme="dark"]{--bg:#101013;--card:#1a1a1f;--text:#f1f1f3;--muted:#9a9aa3;--line:#33333b;--btn:#fff;--btnt:#0b0b0d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
p.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number]{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%}
.file{display:block;text-align:center;padding:14px;border:1.5px dashed var(--line);border-radius:12px;font-size:15px;cursor:pointer}
.file input{display:none}
canvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
button{width:100%;font-size:16px;padding:14px;border:0;border-radius:12px;background:var(--btn);color:var(--btnt);font-weight:600;cursor:pointer;margin-top:10px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
#fallback{display:none}
#fallback img{width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>SECOND LIFE: карточка товара</h1>
  <p class="sub">Загрузите фото, впишите данные. Карточка соберётся сама.</p>

  <div class="card">
    <label class="file"><input type="file" id="file" accept="image/*">Выбрать фото вещи</label>
    <label>Бренд</label><input type="text" id="brand" value="Tommy Hilfiger">
    <div class="row">
      <div><label>Вещь</label><input type="text" id="type" value="Свитшот"></div>
      <div><label>Размер</label><input type="text" id="size" value="XL"></div>
    </div>
    <div class="row">
      <div><label>Состояние (из 10)</label><input type="number" id="cond" value="9" min="1" max="10"></div>
      <div><label>Цена, ₽</label><input type="text" id="price" value="2200" inputmode="numeric"></div>
    </div>
    <div class="row">
      <div><label>Название канала</label><input type="text" id="chan" value="SECOND LIFE"></div>
      <div><label>Ссылка</label><input type="text" id="link" value="t.me/second1life"></div>
    </div>
    <label>Приблизить / отдалить</label><input type="range" id="zoom" min="60" max="250" value="100">
    <label>Сдвиг по горизонтали</label><input type="range" id="ox" min="-100" max="100" value="0">
    <label>Сдвиг по вертикали</label><input type="range" id="oy" min="-100" max="100" value="0">
  </div>

  <div class="card">
    <canvas id="cv" width="1080" height="1350" aria-label="Предпросмотр карточки"></canvas>
    <button id="save">Сохранить картинку</button>
    <div class="hint" id="msg">Готовую картинку отправьте в Telegram как фото.</div>
    <div id="fallback"><div class="hint">Нажмите на картинку и удерживайте, затем выберите «Сохранить».</div><img id="out" alt="Готовая карточка"></div>
  </div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=1080,H=1350,PH=1090,img=null;

function $(i){return document.getElementById(i)}
function fmtPrice(v){var d=String(v).replace(/\D/g,'');if(!d)return String(v);return Number(d).toLocaleString('ru-RU').replace(/\u00a0|\u202f/g,' ')+' ₽'}
function fit(t,maxW,size,weight){var s=size;do{ctx.font=weight+' '+s+'px '+F;if(ctx.measureText(t).width<=maxW)break;s-=2}while(s>24);return s}
function draw(){
  ctx.fillStyle='#0b0b0d';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,PH);
  if(img){
    var z=$('zoom').value/100,s=Math.max(W/img.width,PH/img.height)*z,w=img.width*s,h=img.height*s;
    var dx=(W-w)/2+($('ox').value/100)*Math.abs(w-W)/2,dy=(PH-h)/2+($('oy').value/100)*Math.abs(h-PH)/2;
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,PH);ctx.clip();ctx.drawImage(img,dx,dy,w,h);ctx.restore();
  }else{
    ctx.fillStyle='#a8a8a4';ctx.font='700 64px '+F;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('ФОТО ВЕЩИ',W/2,PH/2-10);ctx.font='700 30px '+F;ctx.fillText('выберите фото выше',W/2,PH/2+55);
  }
  var m=50,L=70;
  function br(x,y,dx,dy){ctx.beginPath();ctx.moveTo(x+dx*L,y);ctx.lineTo(x,y);ctx.lineTo(x,y+dy*L);ctx.stroke()}
  ctx.lineCap='butt';ctx.lineJoin='miter';
  [['#ffffff',18],['#0b0b0d',10]].forEach(function(p){ctx.strokeStyle=p[0];ctx.lineWidth=p[1];br(m,m,1,1);br(W-m,m,-1,1);br(m,PH-m,1,-1);br(W-m,PH-m,-1,-1)});
  var price=fmtPrice($('price').value);
  ctx.font='700 66px '+F;var pw=ctx.measureText(price).width;
  ctx.textAlign='right';ctx.fillStyle='#fff';ctx.fillText(price,W-60,PH+80);
  ctx.font='700 28px '+F;ctx.fillStyle='#bdbdbd';ctx.fillText('ДОСТАВКА ПО РФ',W-60,PH+150);
  var brand=($('brand').value||'').toUpperCase(),sz=fit(brand,W-120-pw-50,58,'700');
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='700 '+sz+'px '+F;ctx.fillText(brand,60,PH+80);
  var c=$('cond').value,parts=[($('type').value||'').toUpperCase(),($('size').value||'').toUpperCase(),c?c+'/10':''].filter(Boolean);
  ctx.fillStyle='#bdbdbd';ctx.font='700 34px '+F;ctx.fillText(parts.join('  ·  '),60,PH+150);
  var txt=[($('chan').value||''),($('link').value||'')].filter(Boolean).join('  \u2022  ');
  var FI='Arial,Helvetica,"Liberation Sans","DejaVu Sans",sans-serif',ts=34;
  do{ctx.font='italic 700 '+ts+'px '+FI;if(ctx.measureText(txt).width<=780)break;ts-=1}while(ts>16);
  var tw=ctx.measureText(txt).width,ty=PH-m-17;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#6b6b6b';ctx.fillText(txt,W/2,ty);
  ctx.fillStyle='#bdbdbd';ctx.fillRect(W/2-tw/2,ty-40,tw,2);
}
['brand','type','size','cond','price','chan','link','zoom','ox','oy'].forEach(function(i){$(i).addEventListener('input',draw)});
$('file').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){img=im;$('zoom').value=100;$('ox').value=0;$('oy').value=0;draw()};
  im.src=u;
});
$('save').addEventListener('click',function(){
  draw();
  cv.toBlob(async function(blob){
    var shown=false;
    try{
      var d=await claude.use('downloads');
      if(d){await d.save({filename:'second-life-card.png',data:blob});$('msg').textContent='Сохранено. Отправьте картинку в Telegram как фото.';return}
    }catch(err){if(err&&err.code==='declined'){return}}
    try{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='second-life-card.png';document.body.appendChild(a);a.click();a.remove()}catch(e2){}
    $('out').src=cv.toDataURL('image/png');$('fallback').style.display='block';$('msg').textContent='Если файл не скачался сам, сохраните картинку ниже.';
  },'image/png');
});
draw();
})();
</script>
</body>
